# Proposes the updates of what Mongoster is built from and with, once a week: the packages of npm (the
# driver, ssh2, Electron and Monaco are what reaches the users) and the actions of the workflows, which are
# named by commit so that a tag moved by someone else changes nothing here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The tools that only build and test, in one pull request.
      development:
        dependency-type: development
        exclude-patterns: ['electron', 'monaco-editor', '@vscode/codicons']
    ignore:
      # The types of the oldest VS Code Mongoster runs in (`engines.vscode`), which vsce checks, and of the
      # Node.js of that VS Code: newer ones would let the code use what is not there.
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Vitest 5 asks for the types of Node.js 22.
      - dependency-name: 'vitest'
        versions: ['>=5']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
