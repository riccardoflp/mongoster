# Builds the extension's package and the desktop app's installers. Each installer is built on its own
# system: a macOS disk image can only be made on macOS.
name: Build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app's packager downloads the Electron it packages: the one of npm is only for `npm run app`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Against a mongod that mongodb-memory-server downloads.
      - run: npm run test:integration
      # Only packaged: publishing to the Marketplace is done by hand.
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: mongoster-Extension
          path: '*.vsix'
          if-no-files-found: error

  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Never published from here: the release job below attaches the files.
      - run: npm run package:app -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mongoster-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  # On a version tag, the release is published with the files and the version's section of the
  # changelog as its notes. A release that already exists, a draft too, gets the files and is published.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Take the notes from the changelog
        run: |
          VERSION="${TAG#v}"
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::No '## $VERSION' section in CHANGELOG.md"
            exit 1
          fi
      - name: Publish the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
            # Notes written by hand are kept.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" files/* --verify-tag --title "Mongoster ${TAG#v}" --notes-file notes.md
          fi
