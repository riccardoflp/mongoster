# Checks the extension and builds its package and the desktop app's installers, all kept as artifacts of the
# run. Each installer is built on its own system: a macOS disk image can only be made on macOS. It publishes
# nothing: on a version tag, release.yml calls it and publishes what it made.
name: Build

on:
  pull_request:
  workflow_dispatch:
  # From release.yml. A tag is not a trigger of its own here, or a release would build everything twice.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A new push to a pull request replaces the run of the one before; a release is never cancelled halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The app's packager downloads the Electron it packages: the one of npm is only for `npm run app`.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Against a mongod that mongodb-memory-server downloads.
      - run: npm run test:integration
      # Only packaged: release.yml publishes this .vsix to the Marketplace.
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: mongoster-Extension
          path: '*.vsix'
          if-no-files-found: error

  app:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Never published from here: release.yml attaches the installers to the draft release.
      - run: npm run package:app -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mongoster-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
